<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Minimal Google Maps 3D Tiles Test</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; }
        .info {
            position: absolute; top: 10px; left: 10px;
            background: rgba(42, 42, 42, 0.9); color: white; padding: 10px;
            border-radius: 5px; font-family: Arial, sans-serif; z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div class="info">
        <h3>Minimal 3D Tiles Test (NO Interception)</h3>
        <div>Center: (37.774900, -122.419400)</div>
        <div id="status">Loading...</div>
    </div>
    
    <script>
        const viewer = new Cesium.Viewer('cesiumContainer', {
            imageryProvider: false,
            baseLayerPicker: false,
            vrButton: false,
            geocoder: false,
            homeButton: true,
            infoBox: true,
            sceneModePicker: true,
            selectionIndicator: true,
            timeline: false,
            navigationHelpButton: true,
            animation: false
        });
        
        viewer.scene.globe.show = false;
        
        // Load tileset with API key in root URL only
        // NO URL interception - this is the minimal test
        const tileset = new Cesium.Cesium3DTileset({
            url: 'https://tile.googleapis.com/v1/3dtiles/root.json?key=YOUR_API_KEY',
            showCreditsOnScreen: true
        });
        
        viewer.scene.primitives.add(tileset);
        
        tileset.readyPromise
            .then(function(loadedTileset) {
                console.log('3D Tiles loaded successfully');
                document.getElementById('status').textContent = 'Tiles loaded!';
                viewer.camera.setView({
                    destination: Cesium.Cartesian3.fromDegrees(-122.4194, 37.7749, 500),
                    orientation: {
                        heading: Cesium.Math.toRadians(0),
                        pitch: Cesium.Math.toRadians(-45),
                        roll: 0.0
                    }
                });
                setTimeout(function() {
                    viewer.zoomTo(loadedTileset);
                }, 1000);
            })
            .otherwise(function(error) {
                console.error('Error loading 3D Tiles:', error);
                document.getElementById('status').textContent = 'Error: ' + error.message;
            });
    </script>
</body>
</html>

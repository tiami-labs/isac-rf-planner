<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Agentic RF Planner</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="sidebar">
    <h2>RF Planner</h2>
    <div id="status">Click on the map to start.</div>
    
    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #444;">
      <h3 style="font-size: 14px; margin-bottom: 10px;">Enter Coordinates</h3>
      <form id="coord-form" style="display: flex; flex-direction: column; gap: 8px;">
        <div>
          <label for="lat-input" style="display: block; font-size: 11px; margin-bottom: 3px;">Latitude:</label>
          <input 
            type="number" 
            id="lat-input" 
            step="any" 
            placeholder="37.7749" 
            style="width: 100%; padding: 5px; box-sizing: border-box; background: #222; color: #eee; border: 1px solid #444; border-radius: 3px; font-size: 12px;"
          />
        </div>
        <div>
          <label for="lon-input" style="display: block; font-size: 11px; margin-bottom: 3px;">Longitude:</label>
          <input 
            type="number" 
            id="lon-input" 
            step="any" 
            placeholder="-122.4194" 
            style="width: 100%; padding: 5px; box-sizing: border-box; background: #222; color: #eee; border: 1px solid #444; border-radius: 3px; font-size: 12px;"
          />
        </div>
        <button 
          type="submit" 
          style="padding: 8px; background: #0066cc; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: bold;"
          onmouseover="this.style.background='#0052a3'"
          onmouseout="this.style.background='#0066cc'"
        >
          Plan RF
        </button>
      </form>
    </div>
    
    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #444;">
      <h3 style="font-size: 14px; margin-bottom: 10px;">Sector Configuration</h3>
      <div id="sectors-container" style="display: flex; flex-direction: column; gap: 10px;">
        <!-- Sectors will be added here dynamically -->
      </div>
      <button 
        id="add-sector-btn"
        type="button"
        style="margin-top: 8px; padding: 6px; background: #006600; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 11px;"
        onmouseover="this.style.background='#005200'"
        onmouseout="this.style.background='#006600'"
      >
        + Add Sector
      </button>
      <div style="margin-top: 8px; font-size: 10px; color: #aaa;">
        Default: Omnidirectional (360°)
      </div>
    </div>
    
    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #444;">
      <div style="margin-bottom: 10px;">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer;">
          <input 
            type="checkbox" 
            id="show-sectors-toggle" 
            checked
            style="cursor: pointer;"
          />
          <span>Show Sector Overlays</span>
        </label>
      </div>
      <button 
        id="clear-map-btn"
        style="width: 100%; padding: 8px; background: #cc0000; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: bold;"
        onmouseover="this.style.background='#aa0000'"
        onmouseout="this.style.background='#cc0000'"
      >
        Clear Map
      </button>
    </div>
  </div>
  <div id="map-container" style="position: absolute; top: 0; right: 0; bottom: 0; left: 230px;">
    <div id="map"></div>
    
    <!-- RSRP Power Scale Legend -->
    <div id="rsrp-legend" style="display: none;">
      <h3>RSRP (dBm)</h3>
      <div id="rsrp-legend-container">
        <div id="rsrp-legend-gradient"></div>
        <div id="rsrp-legend-labels">
          <span id="legend-max">-</span>
          <span id="legend-mid">-</span>
          <span id="legend-min">-</span>
        </div>
      </div>
      <div id="rsrp-legend-values">
        <div>Max: <span id="legend-max-value">-</span> dBm</div>
        <div>Min: <span id="legend-min-value">-</span> dBm</div>
      </div>
    </div>
    
    <!-- Distance Scale Control -->
    <div id="distance-scale"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./app.js"></script>
</body>
</html>

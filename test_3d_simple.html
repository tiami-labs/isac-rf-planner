<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Google Maps 3D Tiles Test</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(42, 42, 42, 0.9);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 1000;
        }
        .legend {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(42, 42, 42, 0.8);
            padding: 10px;
            border-radius: 5px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 1000;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div class="info">
        <h3>3D Map with Heatmap</h3>
        <div>Center: (37.774900, -122.419400)</div>
        <div id="status">Loading...</div>
    </div>
    <div class="legend">
        <h4>3D Heatmap Intensity</h4>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #2196F3;"></div>
            <span>Low Intensity (Blue)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #4CAF50;"></div>
            <span>Medium (Lime)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #FF9800;"></div>
            <span>High (Orange)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #F44336;"></div>
            <span>Very High (Red)</span>
        </div>
    </div>
    
    <script>
        const statusEl = document.getElementById('status');
        const apiKey = 'YOUR_API_KEY';
        const tilesetUrl = 'https://tile.googleapis.com/v1/3dtiles/root.json?key=YOUR_API_KEY';
        
        // Initialize Cesium viewer
        const viewer = new Cesium.Viewer('cesiumContainer', {
            imageryProvider: false,
            baseLayerPicker: false,
            vrButton: false,
            geocoder: false,
            homeButton: true,
            infoBox: true,
            sceneModePicker: true,
            selectionIndicator: true,
            timeline: false,
            navigationHelpButton: true,
            animation: false,
            globe: false  // No default globe, we just want 3D Tiles
        });
        
        // Optional but recommended by Google examples:
        Cesium.RequestScheduler.requestsByServer['tile.googleapis.com:443'] = 18;
        
        // Load Google Maps 3D Tiles using the correct Cesium 1.111 API
        (async function() {
            try {
                statusEl.textContent = 'Requesting tileset...';
                
                const tileset = await Cesium.Cesium3DTileset.fromUrl(
                    tilesetUrl,
                    {
                        showCreditsOnScreen: true
                    }
                );
                
                console.log('3D Tiles loaded', tileset);
                viewer.scene.primitives.add(tileset);
                statusEl.textContent = 'Tiles loaded!';
                
                // Fly to your chosen center
                viewer.camera.setView({
                    destination: Cesium.Cartesian3.fromDegrees(-122.4194, 37.7749, 500),
                    orientation: {
                        heading: Cesium.Math.toRadians(0),
                        pitch: Cesium.Math.toRadians(-45),
                        roll: 0.0
                    }
                });
                
                // Optional: zoom to tileset (commented out to stay at custom camera position)
                // setTimeout(function() {
                //     viewer.zoomTo(tileset);
                // }, 1000);
                
                // Monitor tile loading – Cesium 1.111 uses `loadProgress`
                tileset.loadProgress.addEventListener(function(pending, processing) {
                    console.log('Tiles: pending=' + pending + ', processing=' + processing);
                    if (pending === 0 && processing === 0) {
                        statusEl.textContent = 'All tiles loaded';
                        // Add heatmap after tiles are loaded
                        addHeatmap();
                    }
                });
                
                // Heatmap data
                const heatmapPoints = [{"lat": 37.77399941131068, "lon": -122.4238864347789, "intensity": 0.9819799199552656}, {"lat": 37.77461783418877, "lon": -122.41403949383277, "intensity": 0.05581619008838101}, {"lat": 37.771474238795776, "lon": -122.42529986032797, "intensity": 0.12974116781190714}, {"lat": 37.767141535120544, "lon": -122.41171296587449, "intensity": 0.01736995361573257}, {"lat": 37.773464252561844, "lon": -122.42287775373501, "intensity": 0.8154449057423871}, {"lat": 37.771731087591945, "lon": -122.42853592066984, "intensity": 0.2736664725552954}, {"lat": 37.77840352648382, "lon": -122.4271852616525, "intensity": 0.34093783191783533}, {"lat": 37.78070663964985, "lon": -122.42788475984591, "intensity": 0.1775863060799736}, {"lat": 37.78243706996204, "lon": -122.42758104249573, "intensity": 0.5838288561390439}, {"lat": 37.76703443749332, "lon": -122.41978472097107, "intensity": 0.49666523377607286}, {"lat": 37.775071757335326, "lon": -122.4130183319252, "intensity": 0.6315629500687545}, {"lat": 37.76511902085237, "lon": -122.42880016494485, "intensity": 0.7747518297437482}, {"lat": 37.77406865226344, "lon": -122.41543808828786, "intensity": 0.4334645619381877}, {"lat": 37.7667982143595, "lon": -122.42456862647438, "intensity": 0.12564585575587572}, {"lat": 37.7848784800844, "lon": -122.41669649304303, "intensity": 0.10706978848001625}, {"lat": 37.770945159827164, "lon": -122.41838969205635, "intensity": 0.6991173038299424}, {"lat": 37.78167746117444, "lon": -122.412995089896, "intensity": 0.07351231481635068}, {"lat": 37.7808371766598, "lon": -122.42271039132892, "intensity": 0.0671214759125709}, {"lat": 37.77082134294719, "lon": -122.42694278078895, "intensity": 0.2577699348699841}, {"lat": 37.77719056513824, "lon": -122.41708130844418, "intensity": 0.021653946477503405}, {"lat": 37.778563957538836, "lon": -122.42717379223903, "intensity": 0.8206022087228804}, {"lat": 37.769891440473046, "lon": -122.42025955772534, "intensity": 0.13175050029839708}, {"lat": 37.77013244469172, "lon": -122.42814451522723, "intensity": 0.41206306109746704}, {"lat": 37.76790541412733, "lon": -122.41022136066972, "intensity": 0.32224408521145764}, {"lat": 37.76740939404475, "lon": -122.41447081598575, "intensity": 0.7580649717957533}, {"lat": 37.77433078023, "lon": -122.41820588104494, "intensity": 0.9188630293866438}, {"lat": 37.77261313734676, "lon": -122.41176230045264, "intensity": 0.7797646739079256}, {"lat": 37.7783382923614, "lon": -122.41286457122922, "intensity": 0.39182028180898265}, {"lat": 37.778118648122685, "lon": -122.4196173860575, "intensity": 0.8974450671406289}, {"lat": 37.76894677797714, "lon": -122.41967310351951, "intensity": 0.8600958367909202}, {"lat": 37.76627203253619, "lon": -122.41559590775309, "intensity": 0.04468670171006317}, {"lat": 37.771049348677664, "lon": -122.42743240223663, "intensity": 0.6100208194713759}, {"lat": 37.76493243876384, "lon": -122.42458213474964, "intensity": 0.8174551713997691}, {"lat": 37.77615416004451, "lon": -122.41943738032377, "intensity": 0.10189070603768069}, {"lat": 37.77331824549112, "lon": -122.4211920885471, "intensity": 0.49198960743371467}, {"lat": 37.7710582861829, "lon": -122.42719792067098, "intensity": 0.901678573631483}, {"lat": 37.77401448119102, "lon": -122.42414820958759, "intensity": 0.2749652513959566}, {"lat": 37.77450761031617, "lon": -122.4178716079278, "intensity": 0.9723377716194878}, {"lat": 37.77438650099256, "lon": -122.42240840593894, "intensity": 0.6591967166386639}, {"lat": 37.77945855898213, "lon": -122.41158092706029, "intensity": 0.48449552554990805}, {"lat": 37.77887425529996, "lon": -122.40968964412934, "intensity": 0.015146424694461036}, {"lat": 37.77088871440826, "lon": -122.4246635428117, "intensity": 0.27440557687706646}, {"lat": 37.780079420220055, "lon": -122.42636273811509, "intensity": 0.009732524501652184}, {"lat": 37.76978050936253, "lon": -122.41193624225592, "intensity": 0.5241129958602149}, {"lat": 37.78056507376758, "lon": -122.42910364230463, "intensity": 0.6218505874006784}, {"lat": 37.77987260206727, "lon": -122.4260916977221, "intensity": 0.44980349965443756}, {"lat": 37.784420665459834, "lon": -122.40947083111827, "intensity": 0.9236873503699728}, {"lat": 37.777671640130194, "lon": -122.41954206407888, "intensity": 0.9662676535527253}, {"lat": 37.778631169466166, "lon": -122.42349487260584, "intensity": 0.10707015793131114}, {"lat": 37.780380788010234, "lon": -122.41428593929143, "intensity": 0.45739855149114006}];
                
                // Color gradient function (matching 2D heatmap: blue -> lime -> orange -> red)
                function getHeatmapColor(intensity) {
                    if (intensity < 0.4) {
                        // Blue to Lime
                        const t = intensity / 0.4;
                        return Cesium.Color.fromBytes(
                            Math.floor(33 + (76 - 33) * t),   // R: 33->76
                            Math.floor(150 + (175 - 150) * t), // G: 150->175
                            Math.floor(243 + (80 - 243) * t)   // B: 243->80
                        );
                    } else if (intensity < 0.6) {
                        // Lime to Orange
                        const t = (intensity - 0.4) / 0.2;
                        return Cesium.Color.fromBytes(
                            Math.floor(76 + (255 - 76) * t),   // R: 76->255
                            Math.floor(175 + (152 - 175) * t), // G: 175->152
                            Math.floor(80 + (0 - 80) * t)      // B: 80->0
                        );
                    } else if (intensity < 0.8) {
                        // Orange to Red
                        const t = (intensity - 0.6) / 0.2;
                        return Cesium.Color.fromBytes(
                            255,  // R: 255
                            Math.floor(152 - 67 * t),  // G: 152->85
                            Math.floor(0 + 38 * t)     // B: 0->38
                        );
                    } else {
                        // Red
                        return Cesium.Color.RED;
                    }
                }
                
                // Function to create a circular dot image for billboards
                function createHeatmapDot(color, intensity) {
                    const canvas = document.createElement('canvas');
                    canvas.width = 32;
                    canvas.height = 32;
                    const ctx = canvas.getContext('2d');
                    const radius = 15;
                    
                    ctx.beginPath();
                    ctx.arc(16, 16, radius, 0, 2 * Math.PI, false);
                    ctx.fillStyle = color.toCssColorString();
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = Cesium.Color.WHITE.toCssColorString();
                    ctx.stroke();
                    
                    return canvas.toDataURL();
                }
                
                // Add 3D heatmap points
                function addHeatmap() {
                    statusEl.textContent = 'Adding heatmap...';
                    console.log('Adding ' + heatmapPoints.length + ' heatmap points');
                    
                    heatmapPoints.forEach(function(point) {
                        const color = getHeatmapColor(point.intensity);
                        const height = 10 + point.intensity * 50; // Height based on intensity (10-60m)
                        
                        viewer.entities.add({
                            position: Cesium.Cartesian3.fromDegrees(point.lon, point.lat, height),
                            billboard: {
                                image: createHeatmapDot(color, point.intensity),
                                scale: 0.5 + point.intensity * 1.5, // Scale 0.5-2.0
                                heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND,
                                verticalOrigin: Cesium.VerticalOrigin.BOTTOM
                            },
                            label: {
                                text: point.intensity.toFixed(2),
                                font: '10pt sans-serif',
                                fillColor: Cesium.Color.WHITE,
                                outlineColor: Cesium.Color.BLACK,
                                outlineWidth: 2,
                                style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                                verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                                pixelOffset: new Cesium.Cartesian2(0, -25),
                                show: false  // Hide by default, show on click
                            },
                            description: `
                                <table>
                                    <tr><td><b>Intensity:</b></td><td>${point.intensity.toFixed(3)}</td></tr>
                                    <tr><td><b>Lat:</b></td><td>${point.lat.toFixed(6)}</td></tr>
                                    <tr><td><b>Lon:</b></td><td>${point.lon.toFixed(6)}</td></tr>
                                </table>
                            `
                        });
                    });
                    
                    statusEl.textContent = 'Heatmap added! (' + heatmapPoints.length + ' points)';
                    console.log('Heatmap visualization complete');
                }
            } catch (error) {
                console.error('Error loading 3D Tiles:', error);
                statusEl.textContent = 'Error: ' + (error.message || error);
                alert('Error loading 3D Tiles: ' + (error.message || error));
            }
        })();
    </script>
</body>
</html>
